# Inside the compose network the services reach each other by name, not localhost.
x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  REDIS_URL: redis://redis:6379/0
  # F16 load test knobs: set in the shell or .env, e.g. LLM_PROVIDER=fake docker compose up -d
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  FAKE_LLM_LATENCY_MS: ${FAKE_LLM_LATENCY_MS:-1500}
  FAKE_LLM_JITTER_MS: ${FAKE_LLM_JITTER_MS:-0}
  FAKE_LLM_ERROR_RATE: ${FAKE_LLM_ERROR_RATE:-0.0}
  FAKE_LLM_ESCALATE_PCT: ${FAKE_LLM_ESCALATE_PCT:-30}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-0}
  LLM_RATE_LIMIT_PER_SECOND: ${LLM_RATE_LIMIT_PER_SECOND:-5.0}
  LLM_RATE_LIMIT_BURST: ${LLM_RATE_LIMIT_BURST:-10}

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433 because Postgres.app already uses 5432 on this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: aml-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aml-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply Alembic migrations, then exit.
  migrate:
    build: .
    image: aml-app
    env_file: .env
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: aml-app
    container_name: aml-api
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: aml-app
    container_name: aml-worker
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

  # F16: a second worker for the 1-vs-2-workers sweep. Off by default:
  #   docker compose --profile scale up -d worker worker2
  worker2:
    image: aml-app
    container_name: aml-worker-2
    profiles: ["scale"]
    env_file: .env
    environment: *app-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
